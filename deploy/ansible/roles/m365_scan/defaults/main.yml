---
m365_scan_bin: /usr/local/bin/m365-scan
m365_scan_conf_dir: /etc/m365-scan
m365_scan_state_dir: /var/lib/m365-scan
m365_scan_share_root: /srv/m365-scan
m365_scan_ui_bind_addr: "0.0.0.0:8444"

m365_scan_netbios_name: m365scan
m365_scan_workgroup: WORKGROUP

# The architecture suffix of the artifact deploy/build.sh produced.
m365_scan_arch: amd64

# Samba takes its whole configuration from the registry (`config backend =
# registry` in smb.conf), so these are the real globals. The ones in smb.conf
# are documentation. Seeded only where the registry has no value yet, because
# the admin UI's Settings page owns the first three from then on.
m365_scan_samba_globals:
  netbios name: "{{ m365_scan_netbios_name | upper }}"
  workgroup: "{{ m365_scan_workgroup }}"
  server min protocol: SMB2
  security: user
  map to guest: never
  load printers: "no"
  printing: bsd
  printcap name: /dev/null
  disable spoolss: "yes"
  logging: file
  log file: /var/log/samba/log.%m
  max log size: "1000"
  panic action: /usr/share/samba/panic-action %d
