[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = False
result_format = yaml

[ssh_connection]
pipelining = True
# Trust the key on first contact, pin it afterwards. Never checking it at all
# would leave the run that carries the session secret open to a swapped host.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
