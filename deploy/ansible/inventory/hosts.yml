---
# One box. Rename it here and in the matching inventory/host_vars/<name>.yml.
# All three groups must list it: base_hosts and hardened_hosts are what the two
# imported playbooks target, and a missing group is a silent no-op, not an error.
all:
  children:
    base_hosts:
      hosts: { m365-scan-box: {} }
    hardened_hosts:
      hosts: { m365-scan-box: {} }
    m365_scan_boxes:
      hosts: { m365-scan-box: {} }
