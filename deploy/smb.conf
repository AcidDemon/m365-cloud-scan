# Samba on the box. Shares are never written here: the admin UI creates them at
# runtime with `net conf`, so this file stays static and config-managed.
#
# With `config backend = registry` smbd takes its whole configuration from the
# registry, so the globals below are the values the box is set up with rather
# than the ones smbd reads. Provisioning writes the same values into the
# registry, and the Settings page owns the server name, the workgroup and the
# protocol floor from then on.
[global]
   config backend = registry

   netbios name = M365SCAN
   workgroup = WORKGROUP
   server min protocol = SMB2
   security = user
   map to guest = never

   # The box has no printers and must not advertise any.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000
   panic action = /usr/share/samba/panic-action %d
