# M365 Cloud Scan box — unattended Debian 13 install.
# Embedded in the installer initrd by scripts/build-box-iso.sh, so it is read
# before any d-i question. Fully hands-off on a single-disk machine; on a
# machine with 0 or >1 internal disks it stops at the partitioner for one human
# "Yes" (the deliberate wrong-disk-wipe gate). Per-box config is NOT here — it
# is applied by firstboot.sh. Nothing tenant-specific is baked in.

### Locale / keyboard
d-i debian-installer/locale          string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network (DHCP). The daemon re-asserts its own hostname from netbiosName on
### every start (internal/mdns/mdns.go), so this one is transient.
d-i netcfg/choose_interface          select auto
d-i netcfg/get_hostname              string m365-scan-box
d-i netcfg/get_domain                string local
d-i netcfg/hostname                  string m365-scan-box

### Packages come from a Debian mirror: ansible-core is NOT on DVD-1, so a
### pure-DVD install can't provide the deploy engine. The site must allow
### outbound to the mirror at install time.
d-i apt-setup/use_mirror             boolean true
d-i mirror/country                   string manual
d-i mirror/http/hostname             string deb.debian.org
d-i mirror/http/directory            string /debian
d-i mirror/http/proxy                string
d-i apt-setup/services-select        multiselect security, updates
### The `deb cdrom:` line is written by finish-install.d/10apt-cdrom-setup, which
### runs AFTER late_command (07preseed) — deleting it down there is a no-op. Left
### in place on a real optical drive, the first apt update demands the disc back.
d-i apt-setup/disable-cdrom-entries  boolean true

### Clock
d-i clock-setup/utc                  boolean true
d-i time/zone                        string Europe/Berlin
d-i clock-setup/ntp                  boolean true

### --- Disk selection: only ever an INTERNAL disk, never the USB stick. ---
# Pick the single non-removable disk automatically. Zero or >1 internal disks ->
# leave partman-auto/disk unset so d-i asks which disk (the wrong-disk-wipe gate);
# the static confirms below then let the wipe proceed once a disk is chosen.
# Removable media (the USB stick, which enumerates as a disk) is never a target.
d-i partman/early_command string \
  INTERNAL=""; N=0; \
  for d in /sys/block/sd? /sys/block/nvme?n? /sys/block/vd?; do \
    [ -e "$d" ] || continue; \
    b=$(basename "$d"); \
    case "$b" in loop*|sr*) continue;; esac; \
    [ "$(cat "$d/removable" 2>/dev/null)" = "1" ] && continue; \
    INTERNAL="${INTERNAL:+$INTERNAL }/dev/$b"; N=$((N+1)); \
  done; \
  if [ "$N" = "1" ]; then debconf-set partman-auto/disk "$INTERNAL"; fi; \
  true

d-i partman-auto/method                          string regular
d-i partman-auto/choose_recipe                   select atomic
d-i partman-basicfilesystems/no_swap             boolean false
# Once a disk is known (auto for 1 disk, human-picked for >1) wipe unattended.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition                     select finish
d-i partman/confirm                              boolean true
d-i partman/confirm_nooverwrite                  boolean true
d-i partman-lvm/confirm                          boolean true
d-i partman-lvm/confirm_nooverwrite              boolean true
d-i partman-md/confirm                           boolean true

### Accounts. Root login disabled; the local admin name comes from build-box-iso.sh
### --admin-user, and firstboot passes the same name to ansible as admin_user so the
### account d-i creates is the one base_users manages (sudo + sshusers).
### SSH is key-based (baked authorized_keys); the password is a build-time fallback.
d-i passwd/root-login                boolean false
d-i passwd/user-fullname             string M365 Scan Box Admin
d-i passwd/username                  string @@ADMIN_USER@@
d-i passwd/user-password-crypted     password @@USER_PWD_CRYPT@@

### Packages: pulled from the mirror; firstboot needs ansible + python. samba,
### avahi and openssl are installed by the m365_scan role, not here.
tasksel tasksel/first                multiselect standard
d-i pkgsel/include                   string ansible-core git python3 python3-yaml sudo openssh-server ca-certificates
d-i pkgsel/upgrade                   select none
popularity-contest popularity-contest/participate boolean false

### Kernel messages to a serial port as well as the screen. tty0 is LAST on
### purpose: the last console= wins /dev/console, and that is what firstboot's
### READY/FAILED banner (and any getty) uses — on a real box that must be the
### attached monitor. Serial just gets a copy of kernel output, which is what
### makes the QEMU harness and any serial-console box debuggable.
d-i debian-installer/add-kernel-opts string console=ttyS0,115200n8 console=tty0

### Bootloader — UEFI + BIOS, onto the auto-selected internal disk.
d-i grub-installer/only_debian       boolean true
d-i grub-installer/with_other_os     boolean true
d-i grub-installer/bootdev           string default

### Reboot without the "remove media" prompt.
d-i finish-install/reboot_in_progress note

### --- Lay down the box payload, arm firstboot. ---
### Nothing tenant-specific is copied in: the image is generic and the admin
### connects Microsoft 365 from the box's own web UI after it boots.
d-i preseed/late_command string \
  mkdir -p /target/opt; \
  cp -a /cdrom/payload/m365-scan /target/opt/m365-scan-firstboot; \
  if [ -f /target/opt/m365-scan-firstboot/authorized_keys ]; then \
    install -d -m 700 /target/home/@@ADMIN_USER@@/.ssh; \
    cp /target/opt/m365-scan-firstboot/authorized_keys /target/home/@@ADMIN_USER@@/.ssh/authorized_keys; \
    chmod 600 /target/home/@@ADMIN_USER@@/.ssh/authorized_keys; \
    in-target chown -R @@ADMIN_USER@@:@@ADMIN_USER@@ /home/@@ADMIN_USER@@/.ssh; \
  fi; \
  sed -i 's/^allow-hotplug/auto/' /target/etc/network/interfaces; \
  cp /target/opt/m365-scan-firstboot/m365-scan-firstboot.service /target/etc/systemd/system/m365-scan-firstboot.service; \
  in-target systemctl enable m365-scan-firstboot.service
